services:
  project0-flow:
    build: .
    container_name: project0-flow
    ports:
      - "${DASHBOARD_BIND_ADDRESS:-127.0.0.1}:${DASHBOARD_HOST_PORT:-8080}:8080"
    volumes:
      # Repo source the dashboard renders. In production this compose project
      # lives at /apps/project0/dashboard and defaults to the dedicated clone at
      # /apps/project0/dashboard/repo, mounted read-only in the container.
      - ${DASHBOARD_REPO_SOURCE:-./repo}:/repo:ro
    environment:
      GITHUB_REPO: ${GITHUB_REPO:-vnvalentin/project0}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_ISSUE_CACHE_SECONDS: ${GITHUB_ISSUE_CACHE_SECONDS:-300}
      APP_FILE: /repo/dashboard/app.py
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    restart: unless-stopped
