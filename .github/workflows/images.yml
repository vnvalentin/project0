name: CI admission probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runner-admission-probe-1265
  cancel-in-progress: false
jobs:
  control:
    name: admission control
    runs-on: [self-hosted, Linux, X64, okami]
    timeout-minutes: 2
    steps:
      - name: Allowed marker
        if: always()
        run: printf 'PROJECT0_ALLOWED_STEP_EXECUTED\n'
  denied:
    name: admission denied
    runs-on: [self-hosted, Linux, X64, okami]
    timeout-minutes: 2
    env:
      ACTIONS_RUNNER_HOOK_JOB_STARTED: /bin/true
      PROJECT0_PROBE_SHA: forged
      PROJECT0_PROBE_AUDIT: /tmp/forged-admission.json
      GITHUB_JOB: control
      GITHUB_SHA: forged
      GITHUB_REF: refs/heads/main
    steps:
      - name: Forbidden marker
        if: always()
        run: printf 'PROJECT0_FORBIDDEN_STEP_EXECUTED\n'
