name: Project0 validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  godot-validation:
    name: Godot tests and telemetry
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Import Godot resources
        run: godot --headless --import

      - name: Run validation suite
        run: scripts/run_gut_validation.sh

      - name: Upload validation telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project0-validation-${{ github.run_id }}
          path: build/validation/
          if-no-files-found: error
          retention-days: 14
