name: Project0 validation

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route:
    name: Approve platform-owned source
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      linux_ref: ${{ steps.plan.outputs.linux_ref }}
      windows_ref: ${{ steps.plan.outputs.windows_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify metadata before Linux acquisition
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_validation_routing.py plan
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: routing-${{ github.run_id }}-${{ github.run_attempt }}
          path: routing/
          if-no-files-found: error

  ownership:
    name: Validation ownership and client boundary
    needs: route
    if: always()
    runs-on: [self-hosted, Linux, X64, okami]
    timeout-minutes: 10
    steps:
      - name: Reject missing source approval
        if: ${{ needs.route.result != 'success' || needs.route.outputs.linux_ref == '' }}
        run: exit 1
      - uses: actions/download-artifact@v4
        with:
          name: routing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/routing
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.route.outputs.linux_ref }}
          persist-credentials: false

      - name: Verify approved input identity
        run: python3 scripts/ci_validation_routing.py verify-source --plan "$RUNNER_TEMP/routing/plan.json"

      - name: Test CI routing
        run: python3 scripts/test_ci_validation_routing.py --report build/validation/routing-tests.json

      - name: Test ownership preflight
        shell: bash
        run: |
          mkdir -p build/validation
          python3 scripts/test_validation_ownership.py --report build/validation/ownership-tests.json 2>&1 | tee build/validation/ownership-tests.log

      - name: Check test ownership and static client dependencies
        run: python3 scripts/check_validation_ownership.py --output build/validation/ownership.json

      - name: Bind ownership evidence
        run: python3 scripts/ci_validation_routing.py seal --job ownership --plan "$RUNNER_TEMP/routing/plan.json"

      - name: Upload ownership report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-ownership-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/validation/
          if-no-files-found: error
          retention-days: 14

  godot:
    name: Godot GUT suite
    needs: route
    if: always()
    runs-on: [self-hosted, Linux, X64, okami]
    timeout-minutes: 25
    steps:
      - name: Reject missing source approval
        if: ${{ needs.route.result != 'success' || needs.route.outputs.linux_ref == '' }}
        run: exit 1
      - uses: actions/download-artifact@v4
        with:
          name: routing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/routing
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.route.outputs.linux_ref }}
          persist-credentials: false

      - name: Verify approved input identity
        run: python3 scripts/ci_validation_routing.py verify-source --plan "$RUNNER_TEMP/routing/plan.json"

      - name: Run validation suite
        shell: bash
        run: |
          container="project0-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image=sha256:801341fea24b22777e65e8ad5b38ca306c33e59b4adcdc14c37d8f461b162602
          docker image inspect "$image" >/dev/null
          if docker container inspect "$container" >/dev/null 2>&1; then exit 1; fi
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          timeout --kill-after=15s 1100 docker run --rm --name "$container" --label project0.validation=1259 --network none --no-healthcheck --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/app" -w /app --entrypoint /usr/bin/env "$image" -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/tmp/home XDG_DATA_HOME=/tmp/data XDG_CONFIG_HOME=/tmp/config XDG_CACHE_HOME=/tmp/cache TMPDIR=/tmp RESULT_DIR=build/validation DASHBOARD_RESULTS_DIR=/tmp/dashboard bash scripts/run_gut_validation.sh

      - name: Bind GUT evidence
        run: python3 scripts/ci_validation_routing.py seal --job godot --plan "$RUNNER_TEMP/routing/plan.json"

      - name: Upload validation telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-godot-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/validation/
          if-no-files-found: error
          retention-days: 14

  records:
    name: Delivery record sync
    needs: route
    if: always()
    runs-on: [self-hosted, Linux, X64, okami]
    timeout-minutes: 10
    steps:
      - name: Reject missing source approval
        if: ${{ needs.route.result != 'success' || needs.route.outputs.linux_ref == '' }}
        run: exit 1
      - uses: actions/download-artifact@v4
        with:
          name: routing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/routing
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.route.outputs.linux_ref }}
          persist-credentials: false

      - name: Verify approved input identity
        run: python3 scripts/ci_validation_routing.py verify-source --plan "$RUNNER_TEMP/routing/plan.json"

      - name: Check delivery record sync
        shell: bash
        run: |
          mkdir -p build/validation
          bash scripts/check_record_sync.sh 2>&1 | tee build/validation/records.log

      - name: Check container deployment contract
        shell: bash
        run: bash scripts/test_deploy_containers.sh 2>&1 | tee build/validation/deploy.log

      - name: Bind record evidence
        run: python3 scripts/ci_validation_routing.py seal --job records --plan "$RUNNER_TEMP/routing/plan.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-records-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/validation/
          if-no-files-found: error

  python:
    name: Python service tests
    needs: route
    if: always()
    runs-on: [self-hosted, Linux, X64, okami]
    timeout-minutes: 10
    steps:
      - name: Reject missing source approval
        if: ${{ needs.route.result != 'success' || needs.route.outputs.linux_ref == '' }}
        run: exit 1
      - uses: actions/download-artifact@v4
        with:
          name: routing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/routing
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.route.outputs.linux_ref }}
          persist-credentials: false

      - name: Verify approved input identity
        run: python3 scripts/ci_validation_routing.py verify-source --plan "$RUNNER_TEMP/routing/plan.json"

      - name: Run enrollment and operator tests
        run: python3 -m pytest infra/enrollment/tests infra/operator/tests -q -o junit_family=legacy --junitxml=build/validation/python.xml

      - name: Bind service evidence
        run: python3 scripts/ci_validation_routing.py seal --job python --plan "$RUNNER_TEMP/routing/plan.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-python-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/validation/
          if-no-files-found: error

  launcher:
    name: Windows launcher tests
    needs: route
    if: always()
    # Every file in native/windows_launcher is `//go:build windows`, so these
    # tests can only be compiled and executed on a Windows runner.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Reject missing source approval
        if: ${{ needs.route.result != 'success' || needs.route.outputs.windows_ref == '' }}
        run: exit 1
      - uses: actions/download-artifact@v4
        with:
          name: routing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/routing
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.route.outputs.windows_ref }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: native/windows_launcher/go.sum

      - name: Stage launcher payload placeholders
        shell: bash
        run: scripts/stage_launcher_payload_placeholders.sh

      - name: Run launcher validation
        env:
          PROJECT0_EXPERIMENT_EVIDENCE_DIR: ${{ github.workspace }}/logs/experiments
        shell: pwsh
        run: ./scripts/run_windows_launcher_validation.ps1

      - name: Upload launcher validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project0-windows-launcher-${{ github.run_id }}
          path: |
            build/validation/windows_launcher/
            logs/experiments/exp_1099_hash_mismatch_*.json
          if-no-files-found: error
          retention-days: 14

  aggregate:
    name: Platform-owned validation acceptance
    if: always()
    needs: [route, ownership, godot, records, python, launcher]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Require every existing gate
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        shell: pwsh
        run: |
          $jobs = $env:JOB_RESULTS | ConvertFrom-Json -AsHashtable
          foreach ($job in $jobs.Keys) {
            if ($jobs[$job].result -ne 'success') { throw "$job did not succeed" }
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.route.outputs.windows_ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: routing-${{ github.run_id }}-${{ github.run_attempt }}
          path: routing
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: results
      - name: Reconcile source identity and executed coverage
        run: python scripts/ci_validation_routing.py aggregate --results results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: routing/report.json
          if-no-files-found: error
