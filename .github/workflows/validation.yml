name: Project0 validation

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ownership:
    name: Validation ownership and client boundary
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test ownership preflight
        shell: bash
        run: |
          mkdir -p build/validation
          python scripts/test_validation_ownership.py --report build/validation/ownership-tests.json 2>&1 | tee build/validation/ownership-tests.log

      - name: Check test ownership and static client dependencies
        if: always()
        run: python scripts/check_validation_ownership.py --output build/validation/ownership.json

      - name: Upload ownership report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project0-ownership-${{ github.run_id }}
          path: build/validation/ownership*
          if-no-files-found: error
          retention-days: 14

  godot:
    name: Godot GUT suite
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Import Godot resources
        run: godot --headless --import

      - name: Run validation suite
        run: scripts/run_gut_validation.sh

      - name: Upload validation telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project0-validation-${{ github.run_id }}
          path: build/validation/
          if-no-files-found: error
          retention-days: 14

  records:
    name: Delivery record sync
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check delivery record sync
        run: bash scripts/check_record_sync.sh

      - name: Check container deployment contract
        run: bash scripts/test_deploy_containers.sh

  python:
    name: Python service tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            infra/enrollment/requirements.txt
            infra/operator/requirements.txt

      - name: Install service dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r infra/enrollment/requirements.txt \
                      -r infra/operator/requirements.txt \
                      pytest

      - name: Run enrollment and operator tests
        run: python -m pytest infra/enrollment/tests infra/operator/tests -q

  launcher:
    name: Windows launcher tests
    # Every file in native/windows_launcher is `//go:build windows`, so these
    # tests can only be compiled and executed on a Windows runner.
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: native/windows_launcher/go.sum

      - name: Stage launcher payload placeholders
        shell: bash
        run: scripts/stage_launcher_payload_placeholders.sh

      - name: Run launcher validation
        env:
          PROJECT0_EXPERIMENT_EVIDENCE_DIR: ${{ github.workspace }}/logs/experiments
        shell: pwsh
        run: ./scripts/run_windows_launcher_validation.ps1

      - name: Upload launcher validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project0-windows-launcher-${{ github.run_id }}
          path: |
            build/validation/windows_launcher/
            logs/experiments/exp_1099_hash_mismatch_*.json
          if-no-files-found: error
          retention-days: 14
