# Full Project0 runtime as containers (Slice 106).
#
# Every service runs from an image published by .github/workflows/images.yml,
# pinned by tag, so the deployed artifact is the one CI built. This replaces the
# `git archive` + preserve-host-artifacts model, whose inputs (.godot import
# cache and host venv) existed only on the deployment host.
#
# Usage on the host:
#   PROJECT0_IMAGE_TAG=v1.2.3 docker compose -f deploy/compose.yml up -d
#
# Secrets are never in this file or in the images. They come from
# /etc/project0/*.env, which lives outside the repository and outside the
# container filesystem.
name: project0

x-godot-image: &godot-image
  image: ghcr.io/vnvalentin/project0-godot:${PROJECT0_IMAGE_TAG:-main}

x-infra-image: &infra-image
  image: ghcr.io/vnvalentin/project0-infra:${PROJECT0_IMAGE_TAG:-main}

services:
  # Nakama v1 platform foundation. Nakama is part of the one Project0 runtime
  # stack; secrets and the Nakama YAML config live under /etc/project0, not in
  # this repo or image.
  nakama-db:
    image: postgres:16.8-alpine
    container_name: project0-nakama-db
    env_file:
      - path: /etc/project0/nakama-db.env
        required: true
    volumes:
      - "${NAKAMA_DB_DATA_DIR:-/var/lib/project0/nakama-postgres}:/var/lib/postgresql/data"
      - "${BACKUP_DIR:-/var/backups/project0}:/backup"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-nakama}\" -d \"$${POSTGRES_DB:-nakama}\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  nakama:
    image: registry.heroiclabs.com/heroiclabs/nakama:${NAKAMA_IMAGE_TAG:-3.37.0}
    container_name: project0-nakama
    command: ["/bin/sh", "-ec", "/nakama/nakama --config /nakama.yml migrate up && exec /nakama/nakama --config /nakama.yml"]
    depends_on:
      nakama-db:
        condition: service_healthy
    ports:
      # Client HTTP API and realtime socket surface. This is the only Nakama
      # surface intended for public routing in v1.
      - "${NAKAMA_BIND:-192.168.1.254}:7350:7350"
      # Console/admin UI stays private. Do not bind this to WAN/public IPs.
      - "${NAKAMA_CONSOLE_BIND:-127.0.0.1}:7351:7351"
    volumes:
      - "${NAKAMA_CONFIG_DIR:-/etc/project0/nakama}/nakama.yml:/nakama.yml:ro"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Authoritative fixed-tick game simulation. user:// resolves under HOME=/data,
  # so the mounted volume is what carries accounts and Canon across deploys.
  game-server:
    <<: *godot-image
    container_name: project0-game-server
    env_file:
      # Shared HMAC assertion secret; the login server's issuer and this
      # validator must agree. Optional so the stack starts during bring-up.
      - path: /etc/project0/assertion.env
        required: false
      # Nakama gameplay relay session token. Optional so the legacy ENet/RPC
      # path remains bootable until the operator enables the Nakama bridge.
      - path: /etc/project0/nakama-relay.env
        required: false
    environment:
      PROJECT0_SERVER_BIND_ADDRESS: "0.0.0.0"
      PROJECT0_SERVER_PORT: "9999"
      PROJECT0_ACCOUNTS_DB_PATH: "accounts.db"
      PROJECT0_NAKAMA_URL: "${PROJECT0_NAKAMA_URL:-http://192.168.1.254:7350}"
      PROJECT0_HEALTH_FILE: "/data/health.json"
      PROJECT0_REQUIRED_CLIENT_VERSION: "${PROJECT0_REQUIRED_CLIENT_VERSION:-}"
      PROJECT0_UPDATE_MANIFEST_BASE_URL: "${PROJECT0_UPDATE_MANIFEST_BASE_URL:-https://project0.valentin.vip/patches}"
      # Ollama runs on the HOST. The server's default of 127.0.0.1 resolves to
      # the container's own loopback, which silently disabled JIT sector
      # generation. Use the host's LAN address rather than
      # host.docker.internal: Godot's HTTP client does its own name resolution,
      # so a /etc/hosts alias is not guaranteed to work.
      PROJECT0_OLLAMA_HOST: "${PROJECT0_OLLAMA_HOST:-http://192.168.1.254:11434}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${GAME_BIND:-192.168.1.254}:9999:9999/udp"
    volumes:
      - "${GAME_DATA_DIR:-/var/lib/project0/game}:/data"
      - "${BACKUP_DIR:-/var/backups/project0}:/backup"
    mem_limit: 2g
    cpus: 4.0
    stop_grace_period: 20s
    restart: unless-stopped

  # Standalone login authority: accounts, characters, signed session assertions.
  # Same image as the game server, different entrypoint — see DT-012.
  login-server:
    <<: *godot-image
    container_name: project0-login-server
    entrypoint: ["/usr/bin/tini", "--", "godot", "--headless", "--path", "/app", "-s", "server/login_server_main.gd"]
    env_file:
      - path: /etc/project0/assertion.env
        required: false
      - path: /etc/project0/login.env
        required: false
    environment:
      PROJECT0_SERVER_BIND_ADDRESS: "0.0.0.0"
      PROJECT0_LOGIN_PORT: "9998"
      PROJECT0_LOGIN_ACCOUNTS_DB_PATH: "login_accounts.db"
      PROJECT0_HEALTH_FILE: "/data/health.json"
    ports:
      - "${LOGIN_BIND:-192.168.1.254}:9998:9998/udp"
      # Published here, not on the enrollment service: enrollment shares this
      # container's network namespace (see its network_mode), and a service
      # using another's namespace cannot publish its own ports.
      - "${ENROLLMENT_BIND:-192.168.1.254}:8095:8095"
    volumes:
      - "${LOGIN_DATA_DIR:-/var/lib/project0/login}:/data"
    mem_limit: 1g
    cpus: 2.0
    stop_grace_period: 20s
    restart: unless-stopped

  # Public HTTPS surface: enrollment, registration, character endpoints.
  enrollment:
    <<: *infra-image
    container_name: project0-enrollment
    command: ["uvicorn", "infra.enrollment.asgi:app", "--host", "0.0.0.0", "--port", "8095", "--workers", "1"]
    env_file:
      - path: /etc/project0/enrollment.env
        required: true
    environment:
      # enrollment.env carries the host's in-tree DB path, which does not exist
      # in the container. `environment` overrides `env_file`, so pin it to the
      # mounted volume; the in-tree location is a host-deploy artifact.
      ENROLLMENT_DB_PATH: "/var/lib/project0/enrollment/enrollment.sqlite3"
      # Public, unauthenticated release artifacts. The client must patch before
      # authentication; the client verifies the signature, not this URL.
      ENROLLMENT_PATCHES_DIR: "/var/lib/project0/patches"
    # The login authority's HTTP endpoint binds the literal 127.0.0.1 by
    # deliberate design (ADR 0005 loopback delegation), so it is unreachable
    # across container boundaries. Sharing the login server's network namespace
    # makes 127.0.0.1 the same interface for both processes, reproducing the
    # single-host topology the design assumes without exposing the endpoint.
    network_mode: "service:login-server"
    depends_on:
      - login-server
    volumes:
      - "${ENROLLMENT_DATA_DIR:-/var/lib/project0/enrollment}:/var/lib/project0/enrollment"
      - "${ENROLLMENT_PATCHES_DIR:-/var/lib/project0/patches}:/var/lib/project0/patches:ro"
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8095/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Internal control plane. Bound to loopback only: it is not a public surface.
  operator:
    <<: *infra-image
    container_name: project0-operator
    command: ["uvicorn", "infra.operator.asgi:app", "--host", "0.0.0.0", "--port", "8099", "--workers", "1"]
    env_file:
      - path: /etc/project0/operator.env
        required: false
    ports:
      - "127.0.0.1:8099:8099"
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    profiles: ["operator"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8099/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  dashboard:
    image: ghcr.io/vnvalentin/project0-dashboard:${PROJECT0_IMAGE_TAG:-main}
    container_name: project0-dashboard
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:8080:8080"
    volumes:
      # Read-only view of the repository the dashboard reports on.
      - "${REPO_DIR:-/data/code/project0}:/repo:ro"
      # Slice 165 (telemetry map #282, decision #290): read-only view of the
      # game server's user:// data directory, so the /telemetry page can open
      # telemetry.db. Never mounted read-write — the dashboard has no write
      # endpoint anywhere.
      - "${GAME_DATA_DIR:-/var/lib/project0/game}:/gamedata:ro"
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    profiles: ["dashboard"]
